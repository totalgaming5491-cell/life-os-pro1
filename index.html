<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life OS Pro</title>
<meta name="theme-color" content="#100E19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2F8;--card:#fff;--ink:#1B1626;--mute:#6B6479;--line:#E4DEEC;--soft:#ECE6F6;--on:#1B1626;--acc:#B79CFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100E19;--card:#1A1726;--ink:#EEEAF6;--mute:#9A93AC;--line:#2B2640;--soft:#241F36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#100E19;--card:#1A1726;--ink:#EEEAF6;--mute:#9A93AC;--line:#2B2640;--soft:#241F36;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
h1,h2,.d{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);max-width:640px;margin:auto;padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:center}
header b{font:700 20px "Bricolage Grotesque",system-ui}
header small{display:block;color:var(--mute);font-size:13px}
main{max-width:640px;margin:auto;padding:8px 18px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.hero{background:color-mix(in srgb,var(--acc) 17%,var(--card));border-color:color-mix(in srgb,var(--acc) 40%,var(--line));display:flex;gap:16px;align-items:center;justify-content:space-between;border-radius:28px;padding:22px}
.hero h2{font-size:30px;line-height:1.05;margin:0 0 8px}
.hero p{margin:0;color:var(--mute);font-size:15px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .8s cubic-bezier(.3,.8,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 30px "Bricolage Grotesque",system-ui}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:13px;color:var(--mute);margin:14px 0 2px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it span{flex:1}
.it.on span{color:var(--mute);text-decoration:line-through}
.bx{width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);background:none;flex:none;color:var(--on);font-size:15px;line-height:1;padding:0;transition:transform .15s}
.bx:active{transform:scale(.88)}
.on .bx{background:var(--acc);border-color:var(--acc)}
.x{border:0;background:none;color:var(--mute);font-size:22px;line-height:1;padding:4px 8px}
.row{display:flex;gap:8px;margin-top:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
input[type=text]{flex:1}
.btn{border:0;background:var(--acc);color:var(--on);font:600 15px Figtree,system-ui,sans-serif;padding:11px 18px;border-radius:14px}
.btn:active{transform:scale(.97)}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.w{width:100%;margin-top:10px}
.chips,.seg{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip,.seg button{flex:none;border:1px solid var(--line);background:none;color:var(--mute);padding:7px 14px;border-radius:99px;font:600 13px Figtree,system-ui,sans-serif}
.chip.on,.seg .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{background:var(--soft);padding:4px;border-radius:16px;margin:0 0 14px}
.seg button{flex:1;border:0;border-radius:12px;font-size:14px;padding:9px}
.sw{font:700 56px "Bricolage Grotesque",system-ui;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px}
.empty{color:var(--mute);margin:0;padding:6px 0}
.note{color:var(--mute);font-size:13px;margin:12px 0 0}
.big{margin:0;font-size:17px}
.big strong{font:700 24px "Bricolage Grotesque",system-ui;margin-right:10px}
.fl{display:block;font-size:13px;color:var(--mute);margin-top:12px}
.fl input{display:block;width:100%;margin-top:4px;font-size:16px;color:var(--ink)}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mute);gap:5px}
.bars i{display:block;width:100%;background:var(--soft);border-radius:8px}
.bars .t i{background:var(--acc)}
.mt{margin-top:14px}
.meter{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.bdg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bdg div{border:1px dashed var(--line);border-radius:16px;padding:12px;color:var(--mute);font-size:13px}
.bdg div.on{border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--ink)}
.bdg b{display:block;font:700 15px "Bricolage Grotesque",system-ui}
.alert{background:var(--acc);color:var(--on);border-radius:18px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600}
.alert .btn{background:var(--on);color:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;border:0;background:none;color:var(--mute);display:grid;justify-items:center;gap:2px;font:600 11px Figtree,system-ui,sans-serif;padding:6px 0;border-radius:14px}
nav button.on{color:var(--ink)}
nav button.on svg{background:var(--acc);color:var(--on);border-radius:12px;padding:4px;width:40px;height:28px}
nav svg{transition:all .2s}
dialog{border:1px solid var(--line);border-radius:26px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:20px;max-height:86vh}
dialog::backdrop{background:#0008}
dialog label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
dialog input,dialog select{display:block;width:100%;margin-top:4px;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.s{opacity:1;transform:translate(-50%,0)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div><b>Life OS Pro</b><small id="dt"></small></div><button class="btn o" data-a="set">Settings</button></header>
<main id="app"></main>
<nav aria-label="Sections"><div id="nav"></div></nav>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],M=['Breakfast','Lunch','Snacks','Dinner'],SS=['Morning','Evening','Night'],FG=['Morning','Evening'],KEY='lifeos-pro-v2';
const ic=p=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const TABS=[['today','Today','<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'],['study','Study','<path d="M4 4h16v14H6a2 2 0 0 0-2 2zM4 20a2 2 0 0 1 2-2M9 8h7"/>'],['body','Routine','<path d="M12 21s-8-5-8-11a5 5 0 0 1 8-3 5 5 0 0 1 8 3c0 6-8 11-8 11z"/>'],['food','Food','<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 1-3 4-3 7h3v11"/>'],['rem','Alerts','<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>'],['prog','Progress','<path d="M5 20V10M12 20V4M19 20v-7"/>']];
const iso=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t12=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};
const dur=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m+'m'};
const clk=s=>[Math.floor(s/3600),Math.floor(s%3600/60),Math.floor(s%60)].map(n=>String(n).padStart(2,'0')).join(':');
let uid=Date.now();const nid=()=>++uid;
function fresh(){const ml={Breakfast:'Poha, fruits, milk',Lunch:'Rice, dal, vegetables',Snacks:'Fruits, nuts',Dinner:'Roti, vegetables, dal'},f={};D.forEach(d=>f[d]={...ml});
return{date:iso(),name:'',goal:2,theme:'auto',tot:0,tasks:[],care:['Bathe','Wash face','Body care','Lip care','Gentle eye care'].map((t,i)=>({id:i+1,t,d:0})),
fit:[['Warm-up','Morning'],['Stretching','Morning'],['Walk','Morning'],['Warm-up','Evening'],['Light exercise','Evening'],['Stretching','Evening']].map(([t,s],i)=>({id:i+20,t,s,d:0})),
rest:0,base:0,at:null,food:f,rem:[{id:40,n:'Morning exercise',t:'06:00'},{id:41,n:'Start studying',t:'08:00'},{id:42,n:'Revision',t:'21:00'}],fired:{},hist:{}}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const items=()=>[...S.tasks,...S.care,...(S.rest?[]:S.fit)];
const pct=()=>{const a=items();return a.length?Math.round(a.filter(x=>x.d).length/a.length*100):0};
const secs=()=>S.base+(S.at?(Date.now()-S.at)/1000:0);
function roll(){if(S.date===iso())return false;S.hist[S.date]={p:pct(),s:Math.round(secs())};S.tasks=S.tasks.filter(x=>!x.d);[...S.care,...S.fit].forEach(x=>x.d=0);S.rest=0;S.base=0;if(S.at)S.at=Date.now();S.date=iso();return true}
function streak(){let n=pct()>=60?1:0;const d=new Date();for(;;){d.setDate(d.getDate()-1);const h=S.hist[iso(d)];if(h&&h.p>=60)n++;else break}return n}
const nextRem=()=>[...S.rem].sort((a,b)=>a.t<b.t?-1:1).find(r=>r.t>=hm());
const PH=h=>h>=5&&h<11?['Good morning','#FFA574']:h>=11&&h<17?['Good afternoon','#5BC0EB']:h>=17&&h<21?['Good evening','#B79CFF']:['Good night','#8C9BFF'];
let tab='today',sub='care',fd=D[(new Date().getDay()+6)%7],ring=[],ses=SS[new Date().getHours()<12?0:new Date().getHours()<19?1:2];
const cur=g=>g.includes(ses)?ses:g[g.length-1],G={tasks:SS,fit:FG};
const li=(k,x,del=1)=>`<li class="it${x.d?' on':''}"><button class="bx" data-a="tg" data-k="${k}" data-i="${x.id}" aria-pressed="${!!x.d}" aria-label="${esc(x.t)}">${x.d?'✓':''}</button><span>${esc(x.t)}</span>${del?`<button class="x" data-a="del" data-k="${k}" data-i="${x.id}" aria-label="Delete ${esc(x.t)}">×</button>`:''}</li>`;
function list(k,arr){const g=G[k];if(!arr.length)return'<p class="empty">Nothing here yet. Add your first one below.</p>';
if(!g)return'<ul>'+arr.map(x=>li(k,x)).join('')+'</ul>';
return g.map(n=>{const a=arr.filter(x=>x.s===n);return a.length?`<h3>${n}</h3><ul>${a.map(x=>li(k,x)).join('')}</ul>`:''}).join('')}
const adder=(k,ph)=>{const g=G[k];return`<div class="row"><input type="text" id="n_${k}" placeholder="${ph}" data-ent="1" maxlength="80"><button class="btn" data-a="add" data-k="${k}">Add</button></div>${g?`<div class="chips" role="group" aria-label="Session">${g.map(n=>`<button class="chip${n===cur(g)?' on':''}" data-a="ses" data-s="${n}">${n}</button>`).join('')}</div>`:''}`};
const meter=(n,a)=>{const dn=a.filter(x=>x.d).length,p=a.length?Math.round(dn/a.length*100):0;return`<div class="mt"><div class="split"><span>${n}</span><span>${dn} of ${a.length}</span></div><div class="meter"><i style="width:${p}%"></i></div></div>`};
const V={
today(){const a=items(),dn=a.filter(x=>x.d).length,p=pct(),C=2*Math.PI*50,nx=nextRem(),pend=S.tasks.filter(x=>!x.d).slice(0,4),st=streak();
return`<section class="card hero"><div><h2>${PH(new Date().getHours())[0]}${S.name?', '+esc(S.name):''}</h2><p>${dn} of ${a.length} done<br>${dur(secs())} studied<br>${st?st+'-day streak':'Finish 60% to start a streak'}</p></div><div class="ring"><svg width="118" height="118" viewBox="0 0 118 118" aria-hidden="true"><circle cx="59" cy="59" r="50" fill="none" stroke="var(--card)" stroke-width="11"/><circle cx="59" cy="59" r="50" fill="none" stroke="var(--acc)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg><b>${p}%</b></div></section>
<div class="card"><h2>Next reminder</h2>${nx?`<p class="big"><strong>${t12(nx.t)}</strong>${esc(nx.n)}</p>`:'<p class="empty">Nothing left today. Add a reminder in Alerts.</p>'}</div>
<div class="card"><h2>Still to do</h2>${pend.length?'<ul>'+pend.map(x=>li('tasks',x,0)).join('')+'</ul>':'<p class="empty">All clear. Add a study task to plan your day.</p>'}</div>`},
study(){const g=S.goal*3600,p=Math.min(100,secs()/g*100);return`<div class="card"><h2>Study timer</h2><div class="sw" id="sw">${clk(secs())}</div><div class="meter"><i id="gm" style="width:${p}%"></i></div><p class="note" style="margin-top:8px">Goal: ${S.goal} hour${S.goal>1?'s':''} today</p><div class="row"><button class="btn" data-a="sw">${S.at?'Pause':'Start'}</button><button class="btn o" data-a="swr">Reset</button></div></div><div class="card"><h2>To-do list</h2>${list('tasks',S.tasks)}${adder('tasks','e.g. Complete Physics Chapter 3')}</div>`},
body(){const seg=`<div class="seg"><button class="${sub==='care'?'on':''}" data-a="sub" data-s="care">Personal care</button><button class="${sub==='fit'?'on':''}" data-a="sub" data-s="fit">Fitness</button></div>`;
if(sub==='care'){const dn=S.care.filter(x=>x.d).length;return seg+`<div class="card"><h2>Daily checklist</h2><p class="note" style="margin:0 0 4px">${dn} of ${S.care.length} done today</p>${list('care',S.care)}${adder('care','Add a routine')}</div>`}
return seg+`<div class="card"><div class="split"><div><h2>Rest day</h2><p class="empty" style="padding:0">${S.rest?'Exercise isn’t counted today.':'Turn on to skip exercise today.'}</p></div><button class="btn${S.rest?'':' o'}" data-a="rest" aria-pressed="${!!S.rest}">${S.rest?'On':'Off'}</button></div></div>`+(S.rest?'':`<div class="card"><h2>Exercise plan</h2>${list('fit',S.fit)}${adder('fit','Add an activity')}</div>`)},
food(){return`<div class="chips" style="margin:0 0 14px">${D.map(x=>`<button class="chip${x===fd?' on':''}" data-a="fd" data-d="${x}">${x}${x===D[(new Date().getDay()+6)%7]?' •':''}</button>`).join('')}</div><div class="card"><h2>${FULL[D.indexOf(fd)]}</h2>${M.map(m=>`<label class="fl">${m}<input type="text" value="${esc(S.food[fd][m]||'')}" data-f="${m}" placeholder="What’s planned?"></label>`).join('')}<button class="btn o w" data-a="cp">Copy to every day</button></div>`},
rem(){const r=[...S.rem].sort((a,b)=>a.t<b.t?-1:1);return`<div class="card"><h2>New reminder</h2><div class="row" style="margin-top:0"><input type="text" id="rn" placeholder="Reminder name" data-ent="1" maxlength="60"><input type="time" id="rt" value="07:00" aria-label="Time"></div><button class="btn w" data-a="addr">Add reminder</button></div><div class="card"><h2>Saved reminders</h2>${r.length?'<ul>'+r.map(x=>`<li class="it"><strong class="d" style="min-width:78px">${t12(x.t)}</strong><span>${esc(x.n)}</span><button class="x" data-a="delr" data-i="${x.id}" aria-label="Delete ${esc(x.n)}">×</button></li>`).join('')+'</ul>':'<p class="empty">No reminders saved.</p>'}<p class="note">Alerts ring while the app is open. Allow notifications in Settings to see them in the background where your device supports it.</p></div>`},
prog(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{l:d.toLocaleDateString(undefined,{weekday:'short'}),v:i===6?pct():((S.hist[iso(d)]||{}).p||0),t:i===6}});
const best=Math.max(secs(),...Object.values(S.hist).map(h=>h.s||0)),st=streak(),B=[['First step','Complete a task',S.tot>=1],['On a roll','3-day streak',st>=3],['Week warrior','7-day streak',st>=7],['Deep focus','Study 2 hours in a day',best>=7200]];
return`<div class="card"><h2>Last 7 days</h2><div class="bars">${days.map(x=>`<div class="${x.t?'t':''}"><i style="height:${Math.max(4,x.v*.9)}px"></i>${x.l}</div>`).join('')}</div><p class="note">Today is ${pct()}% complete. Streak: ${st} day${st===1?'':'s'}.</p></div><div class="card"><h2>Today by area</h2>${meter('Study tasks',S.tasks)}${meter('Personal care',S.care)}${S.rest?'<p class="note">Rest day: exercise not counted.</p>':meter('Fitness',S.fit)}<div class="mt split"><span>Study time</span><strong data-live>${dur(secs())}</strong></div></div><div class="card"><h2>Achievements</h2><div class="bdg">${B.map(b=>`<div class="${b[2]?'on':''}"><b>${b[0]}</b>${b[1]}</div>`).join('')}</div></div>`}
};
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.theme;const c=PH(new Date().getHours())[1];r.style.setProperty('--acc',c)}
function render(){roll();theme();$('#dt').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
$('#app').innerHTML=(ring.length?`<div class="alert" role="alert"><span>${ring.map(r=>t12(r.t)+' '+esc(r.n)).join(', ')}</span><button class="btn" data-a="dis">Dismiss</button></div>`:'')+V[tab]();
$('#nav').innerHTML=TABS.map(([k,l,p])=>`<button class="${k===tab?'on':''}" data-t="${k}" aria-label="${l}">${ic(p)}${l}</button>`).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('s'),1800)}
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});
function settings(){$('#dlg').innerHTML=`<h2>Settings</h2><label>Your name<input type="text" data-s="name" value="${esc(S.name)}" maxlength="30"></label><label>Daily study goal<select data-s="goal">${[1,2,3,4,5,6].map(h=>`<option value="${h}"${h===S.goal?' selected':''}>${h} hour${h>1?'s':''}</option>`).join('')}</select></label><label>Appearance<select data-s="theme">${['auto','light','dark'].map(t=>`<option value="${t}"${t===S.theme?' selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select></label><button class="btn w" data-a="nt">Allow notifications</button>${ip?'<button class="btn w" data-a="inst">Install app</button>':''}<button class="btn o w" data-a="exp">Export backup</button><button class="btn o w" data-a="imp">Import backup</button><input type="file" id="fi" accept="application/json" hidden><button class="btn o w" data-a="rst">Reset all data</button><button class="btn w" data-a="cl">Done</button><p class="note">On iPhone, install with Share, then Add to Home Screen.</p>`;$('#dlg').showModal()}
document.addEventListener('click',e=>{const n=e.target.closest('nav button');if(n){tab=n.dataset.t;render();scrollTo(0,0);return}
const b=e.target.closest('[data-a]');if(!b)return;const{a,k,i,d,s}=b.dataset;try{navigator.vibrate&&navigator.vibrate(8)}catch(x){}
if(a==='set')return settings();if(a==='cl')return $('#dlg').close();
if(a==='nt'){try{Notification.requestPermission().then(r=>toast(r==='granted'?'Notifications on':'Notifications blocked'))}catch(x){toast('Not supported here')}return}
if(a==='inst'){ip&&ip.prompt();return}
if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='life-os-backup.json';l.click();toast('Backup saved');return}
if(a==='imp')return $('#fi').click();
if(a==='rst'){if(confirm('Erase all Life OS Pro data on this device?')){S=fresh();save();$('#dlg').close();render();toast('Data reset')}return}
if(a==='tg'){const x=S[k].find(x=>x.id==i);x.d=x.d?0:1;if(x.d)S.tot++}
else if(a==='del')S[k]=S[k].filter(x=>x.id!=i);
else if(a==='add'){const t=$('#n_'+k).value.trim();if(!t)return;S[k].push({id:nid(),t,s:G[k]?cur(G[k]):undefined,d:0});toast('Added')}
else if(a==='ses')ses=s;
else if(a==='sub')sub=s;
else if(a==='sw'){if(S.at){S.base=secs();S.at=null}else S.at=Date.now()}
else if(a==='swr'){S.base=0;S.at=S.at?Date.now():null}
else if(a==='rest')S.rest=S.rest?0:1;
else if(a==='fd')fd=d;
else if(a==='cp'){D.forEach(x=>S.food[x]={...S.food[fd]});toast('Copied to all days')}
else if(a==='addr'){const m=$('#rn').value.trim();if(!m)return;S.rem.push({id:nid(),n:m,t:$('#rt').value||'07:00'});toast('Reminder added')}
else if(a==='delr')S.rem=S.rem.filter(x=>x.id!=i);
else if(a==='dis')ring=[];
save();render()});
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
$('#dlg').addEventListener('change',e=>{const t=e.target,s=t.dataset.s;if(s){S[s]=s==='goal'?+t.value:t.value;save();render()}
if(t.id==='fi'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{S={...fresh(),...JSON.parse(r.result)};save();$('#dlg').close();render();toast('Backup restored')}catch(x){toast('Invalid backup file')}};r.readAsText(t.files[0])}});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(f){S.food[fd][f]=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.ent){const b=e.target.closest('.card').querySelector('[data-a=add],[data-a=addr]');if(b)b.click()}});
function notify(r){try{if(Notification.permission==='granted')navigator.serviceWorker.ready.then(g=>g.showNotification('Life OS Pro',{body:t12(r.t)+' '+r.n,icon:'icon-192.png',tag:'r'+r.id}))}catch(x){}}
function check(){let hit=roll();const n=hm();S.rem.forEach(r=>{const df=mins(n)-mins(r.t);if(S.fired[r.id]!==iso()&&df>=0&&df<=2){S.fired[r.id]=iso();ring.push(r);hit=true;notify(r);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}}});if(hit){save();render()}}
setInterval(()=>{const s=$('#sw');if(s){s.textContent=clk(secs());$('#gm').style.width=Math.min(100,secs()/(S.goal*3600)*100)+'%'}document.querySelectorAll('[data-live]').forEach(n=>n.textContent=dur(secs()))},1000);
setInterval(check,10000);
addEventListener('pagehide',()=>{if(S.at){S.base=secs();S.at=null}save()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();check();
</script>
</body>
</html>
